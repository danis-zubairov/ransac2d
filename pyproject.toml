[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ransac2d"
dynamic = ["version"]
description = "Fit 2D shapes (rectangle, ellipse, circle, etc.) using RANSAC"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Danis Zubairov"}
]
keywords = ["ransac", "rectangle", "ellipse", "circle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "joblib>=1.3",
]


[project.optional-dependencies]
fast = ["numba>=0.59"]
dev = [
    "pre-commit>=3.6",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.15,<0.16",
]
examples = ["matplotlib>=3.8"]

[project.urls]
"Homepage" = "https://github.com/danis-zubairov/ransac2d"
"Issues" = "https://github.com/danis-zubairov/ransac2d/issues"

[tool.setuptools.dynamic]
version = { attr = "ransac2d.__version__" }

[tool.setuptools.packages.find]
exclude = ["tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
